name: Storefront checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/storefront.js
      - run: node --check assets/catalog.js
      - run: node --check assets/enhancements.js
      - run: node --check tests/preview-diagnostics.js
      - run: node --test tests/storefront.test.cjs
